<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema de Estudiantes{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>

    <header>
        <h1>Sistema de Registro</h1>

        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('nosotros') }}">Nosotros</a>
            <a href="{{ url_for('estudiantes') }}">Estudiantes</a>
        </nav>
    </header>

    <main>

        {% block body %}
        {% endblock %}

    </main>

    <footer>
        <p>Sistema de Registro de Estudiantes - 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
